name: CI - Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd="curl -sf http://localhost:6333/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      # "Wait for services" step 可以移除，health check 已處理

      - name: Upload coverage
        uses: codecov/codecov-action@v5   # ← 從 v4 升到 v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t german-visa-rag:latest -t german-visa-rag:${GITHUB_SHA::8} .

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag german-visa-rag:latest ghcr.io/${{ github.repository }}:latest
          docker tag german-visa-rag:latest ghcr.io/${{ github.repository }}:${GITHUB_SHA::8}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${GITHUB_SHA::8}
