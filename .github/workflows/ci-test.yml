name: CI - Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd="curl -sf http://localhost:6333/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,test]"

      # ── Lint ──────────────────────────────────────────
      - name: Lint with Black
        run: black --check src/ tests/ eval/

      - name: Lint with Ruff
        run: ruff check src/ tests/ eval/

      - name: Type checking with mypy
        run: mypy src/ --ignore-missing-imports --allow-untyped-calls
        continue-on-error: true

      # ── Tests ─────────────────────────────────────────
      - name: Run unit tests
        env:
          OPENAI_API_KEY: sk-test-key
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379/0
          SQLITE_DB_PATH: /tmp/test_state.db
          API_KEY: test-key-12345
          ENVIRONMENT: test
        run: pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Run integration tests
        env:
          OPENAI_API_KEY: sk-test-key
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379/0
          SQLITE_DB_PATH: /tmp/test_state.db
          API_KEY: test-key-12345
          ENVIRONMENT: test
        run: pytest tests/integration/ -v --tb=short
        continue-on-error: true

      # ── Coverage (必須在 pytest 之後) ─────────────────
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
