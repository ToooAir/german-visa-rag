# German Visa & Chancenkarte Document Sources
# Restructured: seed domains + discovery rules + optional extra URLs
# Sources: Official immigration authorities, federal employment agencies, and credential recognition bodies
#
# YAML fields per domain (all supported by StrategyRegistry.load_from_yaml):
#   domain, seed_paths, authority_level, default_visa_types,
#   max_depth, max_pages, use_sitemap,
#   allowed_path_patterns, blocked_path_patterns,
#   relevance_keywords, language_prefixes
#
# authority_level values:
#   official      — Government or EU-mandated authority
#   semi_official — Officially linked / government-funded portal
#   third_party   — Independent aggregator or commercial site
#
# NOTE: Domains with a hardcoded strategy in crawl_strategy.py will have their
# YAML values MERGED in (YAML overrides hardcoded where both define the same field).
# New domains not in the hardcoded registry are created fresh from YAML.

# ============================================
# Domain crawl configurations
# ============================================

domains:

  # ── 德國官方移民入口網站 ─────────────────────────────────────────────
  - domain: "www.make-it-in-germany.com"
    # Hardcoded strategy already has path filters; YAML overrides max_pages & seed_paths
    seed_paths:
      - "/en/visa-residence/"
      - "/en/visa-residence/opportunity-card"
      - "/en/visa-residence/types/"
      - "/en/visa-residence/procedure/"
      - "/en/working-in-germany/"
      - "/de/visum-aufenthalt/"
      - "/de/visum-aufenthalt/chancenkarte/chancenkarte-zur-jobsuche"
      - "/de/visum-aufenthalt/fachkraefteeinwanderungsgesetz/"
    authority_level: "official"
    default_visa_types:
      - "general"
      - "chancenkarte"
      - "blue_card"
      - "work_visa"
      - "student_visa"
    max_depth: 3
    max_pages: 200
    use_sitemap: true

  - domain: "www.chancenkarte.com"
    seed_paths:
      - "/en/"
      - "/en/guides/"
      - "/en/news/"
      - "/en/calculator/"
    authority_level: "third_party"   # commercial site, not government
    default_visa_types:
      - "chancenkarte"
    max_depth: 2
    max_pages: 100
    use_sitemap: true

  - domain: "www.germany-visa.org"
    seed_paths:
      - "/"
      - "/work-employment-visa/"
    authority_level: "third_party"
    default_visa_types:
      - "general"
    max_depth: 2
    max_pages: 50
    use_sitemap: true

  - domain: "digital.diplo.de"
    seed_paths:
      - "/"
      - "/chancenkarte"
      - "/visa"
    authority_level: "official"
    default_visa_types:
      - "general"
      - "chancenkarte"
    max_depth: 2
    max_pages: 50
    allowed_path_patterns:
      - "^/chancenkarte"
      - "^/visa"
      - "^/$"
    blocked_path_patterns:
      - "\\.(pdf|jpg|png|gif|svg|css|js)$"
    use_sitemap: false

  - domain: "www.auswaertiges-amt.de"
    seed_paths:
      - "/en/visa-service/"
    authority_level: "official"
    default_visa_types:
      - "general"
      - "work_visa"
      - "chancenkarte"
      - "blue_card"
      - "student_visa"
    max_depth: 3
    max_pages: 100
    allowed_path_patterns:
      - "/en/visa-service/"
      - "/de/service/visa-und-aufenthalt/"
    blocked_path_patterns:
      - "/presse/"
      - "/veranstaltungen/"
      # Confirmed noise from 400-sample analysis
      - "/de/reiseundsicherheit/"    # country travel safety alerts (Haiti, Iran, etc.)
      - "/en/TopicPages/"            # geopolitical topic pages (en)
      - "/de/TopicPages/"            # geopolitical topic pages (de) — was missing
      - "/de/newsroom/"              # German-language news/press room
      - "/en/newsroom/"              # English-language news/press room
      - "\\.(pdf|jpg|png|gif|svg|css|js)$"
    relevance_keywords:
      - "visa"
      - "residence"
      - "work-permit"
      - "skilled"
      - "blue-card"
      - "chancenkarte"
      - "student"
    use_sitemap: true

  - domain: "www.germany.info"
    # German Embassy (US) — limited scope, only skilled worker overview page
    seed_paths:
      - "/us-en/"
    authority_level: "official"
    default_visa_types:
      - "work_visa"
    max_depth: 1
    max_pages: 20
    allowed_path_patterns:
      - "/us-en/skilled"
      - "/us-en/visa"
    use_sitemap: false

  # ── 聯邦核心移民與就業機構 ─────────────────────────────────────────────

  - domain: "www.bamf.de"
    # BAMF: Bundesamt für Migration und Flüchtlinge (聯邦移民與難民局)
    # Hardcoded strategy already defines filters; YAML can fine-tune max_pages
    seed_paths:
      - "/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/"
      - "/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/Fachkraefte/fachkraefte-node.html"
      - "/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/BlaueKarteEU/"
      - "/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/Fachkraefte/Chancenkarte/"
      - "/Shared/Publikationen/"
    authority_level: "official"
    default_visa_types:
      - "general"
      - "blue_card"
      - "chancenkarte"
      - "work_visa"
    max_depth: 3
    max_pages: 150
    use_sitemap: true

  - domain: "www.arbeitsagentur.de"
    # BA: Bundesagentur für Arbeit (聯邦就業局)
    # Hardcoded strategy already defines filters; YAML can fine-tune
    seed_paths:
      - "/en/"
      - "/web/content/EN/findingajob/"
      - "/web/content/EN/institutionunternehmen/"
    authority_level: "official"
    default_visa_types:
      - "work_visa"
      - "blue_card"
    max_depth: 3
    max_pages: 100
    use_sitemap: true

  # ── 學歷認可相關機構 ──────────────────────────────────────────────────

  - domain: "www.kmk.org"
    # KMK + ZAB: Kultusministerkonferenz / Zentralstelle für ausländisches Bildungswesen
    # Hardcoded strategy already defines filters
    seed_paths:
      - "/en/"
      - "/en/themen/recognition-and-transparency/recognition/recognition-of-foreign-qualifications.html"
      - "/zab/en/"
      - "/zab/en/statement-of-comparability.html"
    authority_level: "official"
    default_visa_types:
      - "general"
      - "work_visa"
      - "blue_card"
      - "student_visa"
    max_depth: 3
    max_pages: 100
    use_sitemap: true

  # ── 德國法律條文原文 (BM25 重點對象) ───────────────────────────────────

  - domain: "www.gesetze-im-internet.de"
    # Germany's official federal law portal
    seed_paths:
      - "/aufenthg_2004/"        # Aufenthaltsgesetz (居留法) - DE
      - "/englisch_aufenthg/"    # Aufenthalts法 (居留法) - EN
      - "/beschv_2013/"          # Beschäftigungsverordnung (就業條例) - DE
      - "/englisch_beschv/"      # Employment Ordinance - EN
      - "/v_mkaufenthgv/"        # Aufenthaltsverordnung (居留條例) - DE
      - "/englisch_aufenthv/"    # Residence Ordinance - EN
      - "/stag/"                 # Staatsangehörigkeitsgesetz (國籍法) - DE
      - "/englisch_stag/"        # Nationality Act - EN
      - "/freiz_gg_eu_2004/"     # Freizügigkeitsgesetz/EU - DE
      - "/englisch_freiz_gg_eu/" # EU Freedom of Movement Act - EN
      - "/intv/"                 # Integrationskursverordnung - DE
    authority_level: "official"
    default_visa_types:
      - "general"
      - "work_visa"
      - "blue_card"
      - "chancenkarte"
    max_depth: 2
    max_pages: 100
    allowed_path_patterns:
      - "^/(aufenthg_2004|beschv_2013|v_mkaufenthgv|stag|freiz_gg_eu_2004|intv|englisch_.*)/"
    use_sitemap: false

  - domain: "www.arbeitsagentur.de"
    # BA: Bundesagentur für Arbeit (聯邦就業局)
    seed_paths:
      - "/en/"
      - "/web/content/EN/findingajob/"
      - "/web/content/EN/institutionunternehmen/"
      # BA Fachliche Weisungen (Employment Guidelines)
      - "/datei/dok_ba033210.pdf"
    authority_level: "official"
    default_visa_types:
      - "work_visa"
      - "blue_card"
    max_depth: 3
    max_pages: 150
    use_sitemap: true

  # Note: anabin.kmk.org is a dynamic JSF application — standard crawling yields only
  # query-param URLs. No domain config; rely on pinned extra_urls only.

# ============================================
# Extra URLs (manual additions / special pages)
# ============================================
# Only include pages NOT already covered by the domain crawl above,
# OR high-priority entry points you want pinned regardless of discovery order.

extra_urls:

  # ── make-it-in-germany.com — Pinned high-priority pages ─────────────
  - url: "https://www.make-it-in-germany.com/en/visa-residence/opportunity-card/questions-answers"
    title: "Chancenkarte FAQ - Official"
    authority_level: "official"
    visa_types:
      - "chancenkarte"

  - url: "https://www.make-it-in-germany.com/en/visa-residence/types/it-professionals"
    title: "Visa for IT Professionals - Make It In Germany"
    authority_level: "official"
    visa_types:
      - "work_visa"

  - url: "https://www.make-it-in-germany.com/en/visa-residence/types/studying"
    title: "Visa for Studying - Make It In Germany"
    authority_level: "official"
    visa_types:
      - "student_visa"

  # ── Auswärtiges Amt — Consular services ─────────────────────────────
  - url: "https://www.auswaertiges-amt.de/en/visa-service/215870-215870"
    title: "Visa and Consular Services - Federal Foreign Office"
    authority_level: "official"
    visa_types:
      - "general"

  # ── digital.diplo.de — Online application portal ─────────────────────
  - url: "https://digital.diplo.de/chancenkarte"
    title: "Apply Online for the Opportunity Card"
    authority_level: "official"
    visa_types:
      - "chancenkarte"

  - url: "https://digital.diplo.de/visa"
    title: "Consular Services Portal - Visa Application"
    authority_level: "official"
    visa_types:
      - "general"

  # ── germany.info — German Embassy (US) Skilled Worker overview ───────
  - url: "https://www.germany.info/us-en/skilled-worker-immigration-2304796"
    title: "Skilled Worker Immigration Act 2026 Guidelines - German Embassy US"
    authority_level: "official"
    visa_types:
      - "work_visa"

  # ── germany-visa.org — Third-party reference pages ───────────────────
  - url: "https://www.germany-visa.org/student-visa/student-visa-visum-zu-studienzwecken/"
    title: "Student Visa for Germany"
    authority_level: "third_party"
    visa_types:
      - "student_visa"

  - url: "https://www.germany-visa.org/immigration/residence-permit/eu-blue-card-germany/"
    title: "EU Blue Card Germany Guidelines"
    authority_level: "third_party"
    visa_types:
      - "blue_card"

  # ── BAMF: Federal Immigration & Refugee Authority — Pinned entry points
  - url: "https://www.bamf.de/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/BlaueKarteEU/blauekarteeu-node.html"
    title: "EU Blue Card Germany - BAMF Official Guide"
    authority_level: "official"
    visa_types:
      - "blue_card"

  - url: "https://www.bamf.de/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/Fachkraefte/Chancenkarte/chancenkarte-node.html"
    title: "Chancenkarte (Opportunity Card) - BAMF Official Guide"
    authority_level: "official"
    visa_types:
      - "chancenkarte"

  - url: "https://www.bamf.de/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/Fachkraefte/fachkraefte-node.html"
    title: "Skilled Worker Immigration - BAMF"
    authority_level: "official"
    visa_types:
      - "work_visa"

  # ── BA: Federal Employment Agency — Pinned entry points ──────────────
  - url: "https://www.arbeitsagentur.de/en/findingajob/qualified-professionals-immigrating-to-germany"
    title: "Qualified Professionals Immigrating to Germany - Bundesagentur für Arbeit"
    authority_level: "official"
    visa_types:
      - "work_visa"
      - "blue_card"

  - url: "https://www.arbeitsagentur.de/en/managing-employees/employing-skilled-workers-from-non-eu-countries"
    title: "Employing Skilled Workers from Non-EU Countries - BA Labour Market Approval (Zustimmung)"
    authority_level: "official"
    visa_types:
      - "work_visa"
      - "blue_card"

  # ── KMK / ZAB: Credential Recognition Authorities ────────────────────
  - url: "https://www.kmk.org/en/themen/recognition-and-transparency/recognition/recognition-of-foreign-qualifications.html"
    title: "Recognition of Foreign Qualifications - KMK"
    authority_level: "official"
    visa_types:
      - "general"
      - "work_visa"
      - "blue_card"

  - url: "https://www.kmk.org/zab/en/statement-of-comparability.html"
    title: "Statement of Comparability for Foreign Higher Education Qualifications - ZAB/KMK"
    authority_level: "official"
    visa_types:
      - "general"
      - "work_visa"
      - "blue_card"
      - "student_visa"

  # ── Anabin: Official Foreign Degree Database (static pages only) ──────
  # Dynamic JSF app — only static entry points are indexable by standard crawlers
  - url: "https://anabin.kmk.org/anabin.html"
    title: "Anabin - Database for the Evaluation of Foreign Educational Credentials"
    authority_level: "official"
    visa_types:
      - "general"
      - "work_visa"
      - "blue_card"
      - "student_visa"

  - url: "https://anabin.kmk.org/anabinPortal/help_en.jsf"
    title: "Anabin Help & Guide - How to Use the H+ Rating System"
    authority_level: "official"
    visa_types:
      - "general"
      - "work_visa"
      - "blue_card"

# ============================================
# Crawler settings
# ============================================
update_interval: 24

crawler:
  rate_limit_requests_per_second: 2
  timeout_seconds: 30
  max_retries: 3
  respect_robots_txt: true
  discovery_enabled: true

# Chunking settings
chunking:
  child_chunk_size: 512
  parent_chunk_size: 2048
